[project]
name = "deepseek-ocr-pipeline"
version = "0.1.0"
description = "Extract text from PDFs using DeepSeek OCR V2 on Kaggle GPU"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch==2.10.0",
    "transformers==4.45.2",
    "Pillow==11.3.0",
    "pdf2image==1.17.0",
    "accelerate==1.12.0",
    "pyyaml==6.0.3",
    "addict==2.4.0",
    "huggingface-hub==0.36.2",
    "tokenizers==0.20.3",
    "safetensors==0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.4.0",
]

[project.scripts]
ocr-pipeline = "src.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
